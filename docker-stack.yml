version: '3.8'
services:
  frontend:
    image: ualspeed-frontend:latest
    ports:
      - target: 3000
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
    - ualspeed-overlay
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s    
  results-service:
    image: ualspeed-results:latest
    ports:
    - target: 5002
      published: 5002
      protocol: tcp
      mode: ingress
    networks:
      - ualspeed-overlay
    depends_on:
      - postgres-results
    environment:
      - DB_MASTER_HOST=postgres-results-master
      - DB_SLAVE_HOST=postgres-results-slave
      - DB_PORT=5432
      - DB_NAME=${RESULTS_DB_NAME:-ualspeed_results}
      - DB_USER=${RESULTS_DB_USER:-postgres}
      - DB_PASSWORD=${RESULTS_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5002/results/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
  data-service:
    image: ualspeed-data:latest
    ports:
    - target: 5003
      published: 5003
      protocol: tcp
      mode: ingress
    networks:
      - ualspeed-overlay
    depends_on:
      - postgres-data
    environment:
      - DB_MASTER_HOST=postgres-data-master
      - DB_SLAVE_HOST=postgres-data-slave
      - DB_PORT=5432
      - DB_NAME=${DATA_DB_NAME:-ualspeed_data}
      - DB_USER=${DATA_DB_USER:-postgres}
      - DB_PASSWORD=${DATA_DB_PASSWORD:-postgres}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5003/data/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
  metrics-service:
    image: ualspeed-metrics:latest
    ports:
    - target: 5004
      published: 5004
      protocol: tcp
      mode: ingress
    networks:
      - ualspeed-overlay
    environment:
      - MDB_MASTER_HOST=postgres-metrics-master
      - MDB_SLAVE_HOST=postgres-metrics-slave
      - MDB_PORT=5432
      - MDB_NAME=ualspeed_metrics
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RESULTS_SERVICE=http://results-service:5002
      - DATA_SERVICE=http://data-service:5003
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5004/metrics/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
  postgres-metrics-master:
    image: postgres:15
    command: >
      postgres
      -c wal_level=replica 
      -c max_wal_senders=5 
      -c max_replication_slots=5 
      -c hot_standby=on
      -c synchronous_commit=on
      -c synchronous_standby_names='*'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ualspeed_metrics
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - metrics_master_data:/var/lib/postgresql/data
    networks:
      - ualspeed-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  postgres-metrics-slave:
    image: postgres:15
    command: >
      bash -c "
      until pg_isready -h postgres-metrics-master -p 5432; do sleep 2; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h postgres-metrics-master -D /var/lib/postgresql/data -U postgres -R
      fi;
      docker-entrypoint.sh postgres -c hot_standby=on"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ualspeed_metrics
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - metrics_slave_data:/var/lib/postgresql/data
    networks:
      - ualspeed-overlay
    deploy:
      replicas: 1
  postgres-results-master:
    image: postgres:15
    command: >
      postgres
      -c wal_level=replica 
      -c max_wal_senders=5 
      -c max_replication_slots=5 
      -c hot_standby=on
    environment:
      POSTGRES_USER: ${RESULTS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESULTS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${RESULTS_DB_NAME:-ualspeed_results}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - results_master_data:/var/lib/postgresql/data
    networks:
      - ualspeed-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  postgres-results-slave:
    image: postgres:15
    command: >
      bash -c "
      until pg_isready -h postgres-results-master -p 5432; do sleep 2; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h postgres-results-master -D /var/lib/postgresql/data -U postgres -R
      fi;
      docker-entrypoint.sh postgres -c hot_standby=on"
    environment:
      POSTGRES_USER: ${RESULTS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESULTS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${RESULTS_DB_NAME:-ualspeed_results}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - results_slave_data:/var/lib/postgresql/data 
    networks:
      - ualspeed-overlay
    deploy:
      replicas: 1
  postgres-data-master:
    image: postgres:15
    command: >
      postgres
      -c wal_level=replica 
      -c max_wal_senders=5 
      -c max_replication_slots=5 
      -c hot_standby=on
    environment:
      POSTGRES_USER: ${DATA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DATA_DB_NAME:-ualspeed_data}
    volumes:
      - data_master_data:/var/lib/postgresql/data
    networks:
      - ualspeed-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  postgres-data-slave:
    image: postgres:15
    command: >
      bash -c "
      until pg_isready -h postgres-data-master -p 5432; do sleep 2; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h postgres-data-master -D /var/lib/postgresql/data -U postgres -R
      fi;
      docker-entrypoint.sh postgres -c hot_standby=on"
    environment:
      POSTGRES_USER: ${DATA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DATA_DB_NAME:-ualspeed_data}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - data_slave_data:/var/lib/postgresql/data  
networks:
  ualspeed-overlay:
    driver: overlay
    attachable: true
volumes:
  metrics_master_data:
  metrics_slave_data:
  results_master_data:
  results_slave_data:
  data_master_data:
  data_slave_data:

