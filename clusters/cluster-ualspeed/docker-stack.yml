version: '3.8'

services:

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    volumes:
      - redis-data:/data
    networks:
      - rede-cluster

  manager:
    image: ualspeed-manager:latest
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_1_URL=http://worker-1:8001
      - WORKER_2_URL=http://worker-2:8002
      - SERVICO_DADOS_URL=http://servico-dados:8003
      - SERVICO_RESULTADOS_URL=http://servico-resultados:8004
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    networks:
      - rede-cluster

  worker-1:
    image: ualspeed-worker1:latest
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MANAGER_URL=http://manager:8000
      - WORKER_NOME=worker-1
      - WORKER_URL=http://worker-1:8001
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    networks:
      - rede-cluster

  worker-2:
    image: ualspeed-worker2:latest
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MANAGER_URL=http://manager:8000
      - WORKER_NOME=worker-2
      - WORKER_URL=http://worker-2:8002
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    networks:
      - rede-cluster

networks:
  rede-cluster:
    driver: overlay
    attachable: true

volumes:
  redis-data:
  fastf1-cache:
